interface:
  display_name: "Photo Material Intervention"
  author: "Pilipala9919"
  homepage: "https://github.com/Pilipala9919/photo-material-intervention"
  license: "CC-BY-4.0"
  short_description: "Source-specific photography and handmade-media art direction"
  default_prompt: "Diagnose my photograph once by subject, strongest asset, real problem, fidelity risk, and goal. Choose exactly one route—HOLD, PHOTO_EDIT, CLEANUP, NARRATIVE_TRANSFORM, MATERIAL_TRANSFORM, or ASK. For transformation, prove both source-specific meaning and a visible reason to stop or share before generating. Use one strategy and one generation; do not add generic filters, floating art objects, or repeated variations to rescue a weak idea."
