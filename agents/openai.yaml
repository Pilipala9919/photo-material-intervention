interface:
  display_name: "Photo Material Intervention"
  author: "Pilipala9919"
  homepage: "https://github.com/Pilipala9919/photo-material-intervention"
  license: "CC-BY-4.0"
  short_description: "Source-specific photography and handmade-media art direction"
  default_prompt: "Diagnose my photograph by subject, strongest visual structure, anchors, and risks; then choose one visibly different artistic medium appropriate to that specific scene—such as printmaking, architectural drawing, charcoal, watercolor, gouache, risograph, embroidery, collage, or ink. Define a source-derived transition boundary and one concrete visual event, then make one deliberate generation. Do not stop at ordinary retouching, apply a uniform filter, add a floating decorative object, or offer a style menu unless I ask."
